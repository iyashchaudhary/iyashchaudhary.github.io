<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unfiltered Yash — the real side of my journey</title>
<meta name="description" content="The unfiltered, day-by-day record of Yash Chaudhary's college years — not a portfolio, a diary.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E2557B'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='white' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --uy-bg:#150A0F;
    --uy-bg-alt:#1D1017;
    --uy-panel:rgba(40,22,30,0.55);
    --uy-panel-solid:#241420;
    --uy-line:rgba(255,255,255,0.08);
    --uy-pink:#E2557B;
    --uy-pink-soft:#F2A6BE;
    --uy-text:#F5EEE6;
    --uy-text-dim:#B9A3AC;
    --uy-cream:#F2E8D5;
    --uy-cream-ink:#3A2A24;
    --shadow-card: 0 14px 34px -14px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 85% -5%, rgba(226,85,123,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 100%, rgba(226,85,123,0.10), transparent 60%),
      var(--uy-bg);
    color:var(--uy-text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .hand{font-family:'Caveat',cursive;}
  ::selection{background:var(--uy-pink);color:#1a0d12;}

  /* decorative cherry blossoms — more of them, like the reference */
  .uy-blossoms{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.55;}
  .uy-blossoms svg{position:absolute;}
  .uy-blossoms .b1{top:-70px;right:-50px;width:380px;height:380px;opacity:.6;}
  .uy-blossoms .b2{bottom:-90px;left:-70px;width:340px;height:340px;opacity:.4;}
  .uy-blossoms .b3{top:45%;left:-60px;width:220px;height:220px;opacity:.25;}
  .uy-blossoms .b4{top:18%;right:-70px;width:200px;height:200px;opacity:.2;}
  .blossom-petal{fill:#E2557B;}
  .blossom-center{fill:#7A2E44;}

  .uy-shell{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 60px;
    display:grid; grid-template-columns:230px 1fr; gap:20px;}

  /* ---------- LEFT SIDEBAR ---------- */
  .uy-side{display:flex;flex-direction:column;gap:18px;}
  .uy-brand{padding:4px 2px 10px;}
  .uy-brand .word{font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem;letter-spacing:.2px;}
  .uy-brand .word span{color:var(--uy-pink);}
  .uy-brand .tag{color:var(--uy-text-dim);font-size:.82rem;margin-top:3px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--uy-text-dim);margin-bottom:6px;}
  .back-link:hover{color:var(--uy-pink-soft);text-decoration:none;}

  .uy-nav{display:flex;flex-direction:column;gap:8px;}
  .uy-nav a{
    display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;
    border:1px solid transparent; transition:background .2s ease, border-color .2s ease;
  }
  .uy-nav a .ic{font-size:1.15rem;width:22px;text-align:center;flex:none;}
  .uy-nav a .lbl{font-weight:600;font-size:.94rem;}
  .uy-nav a .sub{display:block;color:var(--uy-text-dim);font-size:.74rem;font-weight:400;margin-top:1px;}
  .uy-nav a:hover{background:rgba(255,255,255,0.04);}
  .uy-nav a.active{background:rgba(226,85,123,0.16);border-color:rgba(226,85,123,0.35);}

  .uy-side-quote{margin-top:auto;padding:18px;border-top:1px solid var(--uy-line);}
  .uy-side-quote .qmark{color:var(--uy-pink);font-family:'Fraunces',serif;font-size:1.8rem;line-height:.6;display:block;margin-bottom:6px;}
  .uy-side-quote p{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--uy-text-dim);margin:0;line-height:1.35;}

  /* ---------- TOP BAR ---------- */
  .uy-topbar{grid-column:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
  .ribbon{
    background:linear-gradient(135deg,#C96B75,#B85A66);
    color:#fff; font-family:'Fraunces',serif;font-weight:600;letter-spacing:.06em;
    font-size:.8rem; padding:9px 20px; clip-path:polygon(0 0,100% 0,96% 100%,0% 100%,4% 50%);
    text-transform:uppercase;
  }
  .uy-topbar .date{color:var(--uy-text-dim);font-size:.85rem;display:flex;align-items:center;gap:6px;}
  .uy-topbar .spacer{flex:1;}
  .btn-write{
    background:var(--uy-panel-solid); border:1px solid var(--uy-line); color:var(--uy-text);
    padding:11px 18px; border-radius:12px; font-size:.85rem; font-weight:600; cursor:pointer;
    display:flex;align-items:center;gap:8px; transition:border-color .2s ease, transform .15s ease;
  }
  .btn-write:hover{border-color:var(--uy-pink); transform:translateY(-1px);}

  /* ---------- CENTER: CORKBOARD ---------- */
  .uy-day-panel{grid-column:2;
    background:
      repeating-linear-gradient(45deg, rgba(70,38,50,0.35) 0, rgba(70,38,50,0.35) 2px, rgba(80,44,56,0.28) 2px, rgba(80,44,56,0.28) 8px),
      linear-gradient(160deg, #3A2029 0%, #2A141D 55%, #22101A 100%);
    border:1px solid var(--uy-line); border-radius:26px;
    padding:clamp(20px,3vw,40px); position:relative; overflow:hidden;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.35);
  }
  .day-head{margin-bottom:26px; text-align:center; position:relative; z-index:2;}
  .day-num{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(2.8rem,6.5vw,3.8rem);letter-spacing:.01em;line-height:1;
    color:var(--uy-text); text-shadow:0 2px 14px rgba(0,0,0,.5);}
  .day-date-pill{
    display:inline-block; margin-top:12px; padding:7px 20px; border:2px solid var(--uy-pink);
    border-radius:30px; font-family:'Fraunces',serif; font-weight:600; letter-spacing:.05em;
    font-size:.95rem; color:var(--uy-pink-soft); background:rgba(21,10,15,.45);
  }

  /* the pinned big note */
  .big-note{
    position:relative; max-width:860px; margin:0 auto;
    background:var(--uy-cream); color:var(--uy-cream-ink);
    border-radius:4px; padding:44px clamp(26px,5vw,60px) 40px;
    box-shadow:
      0 18px 40px -12px rgba(0,0,0,.55),
      0 2px 6px rgba(0,0,0,.3),
      inset 0 0 80px rgba(120,80,60,.08);
    transform:rotate(-0.6deg);
    z-index:2;
  }
  .big-note::before{ /* tape strip across the top */
    content:""; position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(-1.5deg);
    width:110px; height:28px;
    background:rgba(200,160,90,.6); border:1px solid rgba(255,255,255,.18);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .big-note .pin{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F0887A 0%, #C93A3A 55%, #7E1E1E 100%);
    box-shadow:0 5px 12px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.35), 0 1px 2px rgba(255,255,255,.4);
    z-index:3;
  }
  .big-note .pin::after{ /* pin shadow on the note */
    content:""; position:absolute; top:24px; left:50%; transform:translateX(-50%);
    width:38px; height:10px; border-radius:50%;
    background:rgba(0,0,0,.25); filter:blur(4px);
  }
  .big-note .note-date{
    font-family:'Caveat',cursive; font-size:1.4rem; color:#A65A6B; text-align:center; margin:8px 0 14px;
  }
  .big-note .note-text{
    font-family:'Caveat',cursive; font-size:clamp(1.45rem,2.6vw,1.85rem); line-height:1.42;
  }
  .big-note .note-text p{margin:0 0 16px;}
  .big-note .note-text p:last-child{margin-bottom:0;}

  /* photo under the note */
  .note-photo{
    position:relative; z-index:2; max-width:380px; margin:28px auto 0;
  }
  .polaroid{
    background:#efe9df; padding:10px 10px 40px; border-radius:3px; box-shadow:var(--shadow-card);
    transform:rotate(1.2deg); position:relative;
  }
  .polaroid img{width:100%; display:block; border-radius:1px; background:#3a2c33; aspect-ratio:4/5; object-fit:cover;}
  .polaroid .cap{
    position:absolute; bottom:10px; left:12px; right:12px; font-family:'Caveat',cursive;
    color:#3a2c33; font-size:1.05rem; text-align:center;
  }

  /* documentary */
  .note-doc{
    position:relative; z-index:2; max-width:640px; margin:28px auto 0;
  }
  .doc-frame{
    position:relative; padding-bottom:56.25%; height:0; border-radius:14px; overflow:hidden;
    box-shadow:var(--shadow-card); border:1px solid rgba(255,255,255,.08);
  }
  .doc-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .doc-placeholder{
    background:linear-gradient(160deg,#3a2230,#1a0f16); border:1px solid rgba(226,85,123,.3);
    border-radius:14px; padding:34px 24px; text-align:center; box-shadow:var(--shadow-card);
    position:relative;
  }
  .doc-placeholder .badge{display:inline-block;background:rgba(0,0,0,.55); color:#fff; font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:6px; letter-spacing:.05em;margin-bottom:14px;}
  .doc-placeholder .play{
    width:62px;height:62px;border-radius:50%; background:var(--uy-pink); color:#fff;
    display:inline-flex; align-items:center; justify-content:center; font-size:1.4rem;
    box-shadow:0 6px 20px rgba(226,85,123,.5); margin-bottom:12px;
  }
  .doc-placeholder .t{font-family:'Fraunces',serif; font-weight:600; color:var(--uy-pink-soft); font-size:1.05rem;}
  .doc-placeholder .m{color:var(--uy-text-dim); font-size:.78rem; margin-top:5px;}

  /* ---------- BOTTOM STRIP ---------- */
  .uy-strip{grid-column:2;margin-top:18px; background:var(--uy-panel-solid); border:1px solid var(--uy-line); border-radius:18px; padding:12px 16px; display:flex; align-items:center; gap:10px;}
  .uy-strip .month{font-size:.72rem; color:var(--uy-text-dim); text-transform:uppercase; letter-spacing:.06em; flex:none; margin-right:6px;}
  .strip-days{display:flex; gap:8px; overflow-x:auto; flex:1; scrollbar-width:none;}
  .strip-days::-webkit-scrollbar{display:none;}
  .strip-arrow{background:none;border:none;color:var(--uy-text-dim);cursor:pointer;font-size:1rem;flex:none;padding:4px;}
  .day-chip{
    flex:none; width:52px; text-align:center; padding:8px 4px; border-radius:12px; cursor:pointer;
    border:1px solid transparent; color:var(--uy-text-dim); font-size:.78rem;
  }
  .day-chip .n{display:block;font-weight:700;font-size:.95rem;color:var(--uy-text);}
  .day-chip.active{background:var(--uy-pink); color:#fff;}
  .day-chip.active .n{color:#fff;}
  .day-chip.empty{opacity:.35; cursor:default;}
  .btn-all{flex:none; background:transparent; border:1px solid var(--uy-line); color:var(--uy-text); padding:9px 16px; border-radius:10px; font-size:.8rem; cursor:pointer; white-space:nowrap;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--uy-text-dim);}
  .empty-state .big{font-family:'Fraunces',serif; font-size:1.4rem; color:var(--uy-text); margin-bottom:8px;}

  /* ---------- SECTION HEADER ---------- */
  .sec-head{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .btn-add{padding:10px 18px;border-radius:20px;border:1px solid var(--uy-pink);background:rgba(226,85,123,.14);color:var(--uy-pink);font-weight:600;font-size:.82rem;cursor:pointer;}
  .btn-add:hover{background:var(--uy-pink);color:#fff;}
  .sec-head .day-num{font-size:clamp(2rem,4.4vw,2.6rem);}
  .sec-head p{color:var(--uy-text-dim);margin-top:8px;font-size:.95rem;}

  /* ---------- THINGS I LEARNED & TRIED : combined list ---------- */
  .lt-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  .lt-card{background:#efe9df;color:#3a2c33;border-radius:6px;padding:18px 20px;box-shadow:var(--shadow-card);position:relative;transform:rotate(var(--r,-0.4deg));}
  .lt-card:nth-child(odd){--r:0.5deg;}
  .lt-card .tc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .lt-card h4{font-family:'Fraunces',serif;font-size:1.15rem;margin:0;color:#3a2233;}
  .pill{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:20px;flex:none;}
  .pill.worked{background:#cfe3cf;color:#2d4a2d;}
  .pill.failed{background:#e8c6c6;color:#5c2a2a;}
  .pill.mixed{background:#e9dcb8;color:#5c4a1c;}
  .pill.course{background:#c9d8e8;color:#233F4C;}
  .tc-date{font-size:.72rem;color:#7a6a63;margin-bottom:12px;}
  .tc-row{margin-bottom:8px;font-size:.92rem;}
  .tc-row b{font-family:'Fraunces',serif;font-weight:600;color:var(--uy-pink);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:2px;}

  /* ---------- RANDOM STUFF : corkboard ---------- */
  .random-grid{column-count:3;column-gap:16px;}
  @media(max-width:900px){.random-grid{column-count:2;}}
  @media(max-width:560px){.random-grid{column-count:1;}}
  .random-note{break-inside:avoid;margin-bottom:16px;background:var(--uy-cream);color:var(--uy-cream-ink);border-radius:4px;padding:16px;box-shadow:var(--shadow-card);transform:rotate(var(--r,0deg));font-family:'Caveat',cursive;font-size:1.25rem;line-height:1.3;}
  .random-note:nth-child(4n+1){--r:-1deg;}
  .random-note:nth-child(4n+2){--r:0.8deg;}
  .random-note:nth-child(4n+3){--r:-0.5deg;}
  .random-note:nth-child(4n+4){--r:1deg;}
  .random-note img{width:100%;border-radius:3px;margin-bottom:8px;display:block;}

  /* ---------- ALL ENTRIES ARCHIVE ---------- */
  .archive-search{margin-bottom:18px;}
  .archive-search input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--uy-line);background:var(--uy-panel-solid);color:var(--uy-text);font-size:.9rem;font-family:'Inter',sans-serif;}
  .archive-search input:focus{outline:none;border-color:var(--uy-pink);}
  .arch-year{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:var(--uy-pink-soft);margin:26px 0 10px;padding-left:4px;}
  .arch-year:first-of-type{margin-top:6px;}
  .arch-month{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--uy-text-dim);margin:14px 0 10px;padding-left:4px;}
  .arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .arch-day{background:var(--uy-panel-solid);border:1px solid var(--uy-line);border-radius:14px;padding:14px 16px;transition:border-color .2s ease;}
  .arch-day:hover{border-color:rgba(226,85,123,.45);}
  .ad-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .ad-num{font-family:'Fraunces',serif;font-weight:700;font-size:1rem;color:var(--uy-text);}
  .ad-video{font-size:.9rem;}
  .ad-date{font-size:.72rem;color:var(--uy-text-dim);margin-bottom:8px;}
  .ad-snip{font-family:'Caveat',cursive;font-size:1.12rem;color:var(--uy-text);margin-bottom:12px;line-height:1.25;}
  .ad-actions{display:flex;flex-direction:column;gap:5px;}
  .ad-actions button{background:none;border:1px solid var(--uy-line);color:var(--uy-text);font-size:.78rem;padding:6px 10px;border-radius:9px;cursor:pointer;}
  .ad-actions button:hover{border-color:var(--uy-pink);color:var(--uy-pink-soft);}
  .ad-vlink{font-size:.76rem;color:var(--uy-pink-soft);}

  /* Edit entry button */
  .btn-edit-entry {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--uy-line);
    color: var(--uy-text-dim);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: all 0.2s ease;
    font-size: 14px;
  }
  .btn-edit-entry:hover {
    background: var(--uy-pink);
    color: #fff;
    border-color: var(--uy-pink);
    transform: scale(1.1);
  }

  @media (max-width:980px){
    .uy-shell{grid-template-columns:1fr; padding:16px;}
    .uy-side{flex-direction:row; flex-wrap:wrap; order:1;}
    .uy-brand{width:100%;}
    .uy-nav{flex-direction:row; flex-wrap:wrap; width:100%;}
    .uy-nav a{flex:1 1 45%;}
    .uy-side-quote{display:none;}
    .uy-topbar{order:2;}
    .uy-day-panel{order:3;}
    .uy-strip{order:4;}
  }
</style>
</head>

<div class="uy-shell">

  <!-- LEFT SIDEBAR -->
  <aside class="uy-side">
    <div class="uy-brand">
      <a class="back-link" href="index.html">← back to portfolio</a>
      <div class="word">UNFILTERED <span>YASH</span> 😼</div>
      <div class="tag">the real side of my journey</div>
    </div>
    <nav class="uy-nav" id="uy-nav">
      <a href="#daily" data-view="daily" class="active"><span class="ic">🏠</span><span><span class="lbl">Daily Life</span><span class="sub">Day by day</span></span></a>
      <a href="#learned-tried" data-view="learned-tried"><span class="ic">🧪</span><span><span class="lbl">Things I Learned &amp; Tried</span><span class="sub">Courses, experiments &amp; new stuff</span></span></a>
      <a href="#random" data-view="random"><span class="ic">🖼️</span><span><span class="lbl">Random Stuff</span><span class="sub">Thoughts, pics, half-ideas</span></span></a>
    </nav>
    <div class="uy-side-quote">
      <span class="qmark">"</span>
      <p>Some days are productive,<br>some days are not.<br>All days are real.<br>All days matter.</p>
    </div>
  </aside>

  <!-- TOP BAR -->
  <div class="uy-topbar">
    <div class="ribbon" id="uy-ribbon">Daily Life</div>
    <div class="date" id="uy-topdate">— — —</div>
    <div class="spacer"></div>
    <button class="btn-write" id="btn-write" type="button">✏️ Write Today's Entry</button>
  </div>

  <!-- CENTER: CORKBOARD -->
  <main class="uy-day-panel" id="uy-day-content">
    <!-- filled by JS -->
  </main>

  <!-- BOTTOM CALENDAR STRIP -->
  <div class="uy-strip" id="uy-strip">
    <span class="month" id="uy-month-label">— —</span>
    <button class="strip-arrow" id="strip-prev">‹</button>
    <div class="strip-days" id="strip-days"></div>
    <button class="strip-arrow" id="strip-next">›</button>
    <button class="btn-all" id="btn-all">All Entries ⊞</button>
  </div>

</div>

<script src="entries-data.js"></script>
<script src="sections-data.js"></script>
<script>
(function(){
  const entries = (window.UNFILTERED_ENTRIES || []).slice().sort((a,b)=>a.day-b.day);
  let currentDay = entries.length ? entries[entries.length-1].day : null;

  const dayContent = document.getElementById('uy-day-content');
  const topDate = document.getElementById('uy-topdate');
  const stripDays = document.getElementById('strip-days');
  const monthLabel = document.getElementById('uy-month-label');

  function esc(s){ return (s||'').toString(); }

  function ytId(url){
    if(!url) return null;
    var m = url.toString().match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  function monthOf(dateStr){
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  }

  function renderDay(entry){
    if(!entry){
      dayContent.innerHTML = `<div class="empty-state"><div class="big">No entries yet</div>Day one is coming soon. 🌸</div>`;
      topDate.textContent = '— — —';
      return;
    }
    topDate.textContent = `${monthOf(entry.date)}${entry.weekday ? ', '+entry.weekday : ''}`;

    let body = `
      <div class="day-head" style="position:relative;">
        <button class="btn-edit-entry" title="Edit this entry" onclick="editEntryPrompt(${entry.day})">✏️</button>
        <div class="day-num">DAY ${String(entry.day).padStart(2,'0')}</div>
        <span class="day-date-pill">${monthOf(entry.date).toUpperCase()}${entry.weekday ? ' · '+entry.weekday.toUpperCase() : ''}</span>
      </div>`;

    // the big pinned note
    if(entry.journal){
      const paras = entry.journal.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      body += `
        <div class="big-note">
          <div class="pin"></div>
          <div class="note-date">${monthOf(entry.date)}${entry.weekday ? ', '+entry.weekday : ''}</div>
          <div class="note-text">${paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
        </div>`;
    }

    // photo under the note
    if(entry.photo && entry.photo.src){
      body += `
        <div class="note-photo">
          <div class="polaroid">
            <img src="${esc(entry.photo.src)}" alt="${esc(entry.photo.caption)}">
            <div class="cap">${esc(entry.photo.caption)}</div>
          </div>
        </div>`;
    }

    // documentary
    if(entry.documentary && entry.documentary.youtubeUrl){
      const id = ytId(entry.documentary.youtubeUrl);
      if(id){
        const title = (entry.documentary.title && entry.documentary.title.trim()) || 'Today\'s documentary';
        body += `
          <div class="note-doc">
            <div class="doc-frame">
              <iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${esc(title)} — Day ${String(entry.day).padStart(2,'0')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>`;
      }
    }

    dayContent.innerHTML = body;
  }

  function renderStrip(){
    if(!entries.length){ stripDays.innerHTML=''; monthLabel.textContent='—'; return; }
    const active = entries.find(e=>e.day===currentDay) || entries[entries.length-1];
    const d = new Date(active.date);
    monthLabel.textContent = d.toLocaleDateString('en-US',{month:'long',year:'numeric'}).toUpperCase();

    stripDays.innerHTML = entries.map(e=>{
      const dd = new Date(e.date);
      const wd = dd.toLocaleDateString('en-US',{weekday:'short'});
      const dn = String(dd.getDate()).padStart(2,'0');
      return `<div class="day-chip ${e.day===active.day?'active':''}" data-day="${e.day}"><span class="n">${dn}</span>${wd}</div>`;
    }).join('');

    stripDays.querySelectorAll('.day-chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        currentDay = parseInt(el.dataset.day,10);
        const e = entries.find(x=>x.day===currentDay);
        renderDay(e);
        renderStrip();
        setActiveNav('daily');
      });
    });
  }

  function setActiveNav(view){
    document.querySelectorAll('#uy-nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  }

  function openWriteModal(){
    window.location.href = 'admin.html';
  }
  document.getElementById('btn-write').addEventListener('click', openWriteModal);

  // ---------- ALL ENTRIES ARCHIVE + SEARCH ----------
  function renderArchive(filterText){
    const f = (filterText || '').trim().toLowerCase();
    const list = entries.filter(e=>{
      if(!f) return true;
      const hay = [
        'DAY '+String(e.day).padStart(2,'0'), monthOf(e.date), e.weekday||'',
        e.journal||'',
        e.documentary && e.documentary.title || '',
        e.photo && e.photo.caption || ''
      ].join(' ').toLowerCase();
      return hay.includes(f);
    });

    let body = '<div class="sec-head"><div class="day-num">⊞ All Entries</div><p>Every day in one place — jump to any day, or search by topic or keyword.</p></div>';
    body += '<div class="archive-search"><input id="archive-q" type="text" placeholder="Search days… try “college”, “ACCA”, “gym”" value="' + esc(filterText) + '"></div>';

    if(!list.length){
      body += '<div class="empty-state"><div class="big">No days found</div>Nothing matches “' + esc(filterText) + '” yet.</div>';
      dayContent.innerHTML = body;
      wireSearch();
      return;
    }

    // group by year → month
    const groups = {};
    list.forEach(e=>{
      const d = new Date(e.date);
      const yk = d.getFullYear();
      const mk = d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      (groups[yk] = groups[yk] || {})[mk] = groups[yk][mk] || [];
      groups[yk][mk].push(e);
    });

    Object.keys(groups).sort().forEach(y=>{
      body += '<div class="arch-year">' + y + '</div>';
      Object.keys(groups[y]).forEach(m=>{
        body += '<div class="arch-month">' + m + '</div><div class="arch-grid">';
        groups[y][m].forEach(e=>{
          const snip = e.journal ? e.journal.split(/\n+/).map(s=>s.trim()).filter(Boolean)[0].slice(0,90) : '';
          const hasVideo = !!ytId(e.documentary && e.documentary.youtubeUrl);
          body += '<div class="arch-day" style="position:relative;"><button class="btn-edit-entry" style="top:8px;right:8px;width:26px;height:26px;font-size:11px;" title="Edit this entry" onclick="event.stopPropagation();editEntryPrompt('+e.day+')">✏️</button><div class="ad-top"><span class="ad-num">DAY '+String(e.day).padStart(2,'0')+'</span>'+(hasVideo?'<span class="ad-video">🎥</span>':'')+'</div><div class="ad-date">'+esc(monthOf(e.date))+(e.weekday?', '+esc(e.weekday):'')+'</div>'+(snip?'<div class="ad-snip">'+esc(snip)+(snip.length>=90?'…':'')+'</div>':'')+'<div class="ad-actions"><button data-go="'+e.day+'">Open day →</button>'+(hasVideo?'<a class="ad-vlink" href="https://www.youtube.com/watch?v='+ytId(e.documentary.youtubeUrl)+'" target="_blank" rel="noopener">Watch documentary →</a>':'')+'</div></div>';
        });
        body += '</div>';
      });
    });
    dayContent.innerHTML = body;
    wireSearch();
    dayContent.querySelectorAll('.ad-actions button[data-go]').forEach(b=>{
      b.addEventListener('click', ()=>{
        currentDay = parseInt(b.dataset.go,10);
        setActiveNav('daily');
        document.getElementById('uy-ribbon').textContent = 'Daily Life';
        const entry = entries.find(x=>x.day===currentDay);
        renderDay(entry);
        topDate.textContent = entry ? monthOf(entry.date) + (entry.weekday?', '+entry.weekday:'') : '— — —';
        renderStrip();
      });
    });
  }
  function wireSearch(){
    const q = dayContent.querySelector('#archive-q');
    if(!q) return;
    q.addEventListener('input', ()=> renderArchive(q.value));
    q.focus();
  }
  document.getElementById('btn-all').addEventListener('click', ()=> renderArchive(''));

  window.editEntryPrompt = function(day) {
    const pass = prompt("Enter passcode to edit:");
    if(pass === "yash2026") {
      window.location.href = `admin.html?mode=edit&day=${day}`;
    } else if(pass !== null) {
      alert("Wrong passcode!");
    }
  };

  const secMeta = {
    'learned-tried': { icon:'🧪', title:'Things I Learned &amp; Tried'.replace('&amp;','&'), sub:'Courses, skills, experiments and new stuff — what I actually learned, not just certificates.' },
    random: { icon:'🖼️', title:'Random Stuff', sub:"Thoughts, screenshots, half-ideas — things that don't belong anywhere else." }
  };

  function secAddButton(view){
    if(view==='daily') return '';
    return '<button class="btn btn-add" onclick="location.href=\'admin.html?section='+view+'\'">+ Add new</button>';
  }
  function secHeader(view){
    const m = secMeta[view];
    return `<div class="sec-head"><div class="day-num">${m.icon} ${m.title}</div><div class="btn btn-add" onclick="location.href='admin.html?section=${view}'">+ Add new</div><p>${m.sub}</p></div>`;
  }
  function emptyBlock(msg){
    return `<div class="empty-state" style="padding:40px 10px;"><div class="big">Nothing here yet</div>${msg} 🌸</div>`;
  }

  function renderLearnedTried(){
    const tried = window.THINGS_TRIED || [];
    const learned = window.THINGS_LEARNED || [];
    let list = [];
    tried.forEach(t=>list.push({kind:'tried', data:t, date:t.date||''}));
    learned.forEach(c=>list.push({kind:'learned', data:c, date:c.completedDate||''}));
    list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    let body = secHeader('learned-tried');
    if(!list.length){ body += emptyBlock('Try something or finish a course, then come write about it.'); }
    else {
      body += '<div class="lt-grid">' + list.map(item=>{
        if(item.kind === 'tried'){
          const t = item.data;
          return `
            <div class="lt-card">
              <div class="tc-top"><h4>${esc(t.title)}</h4><span class="pill ${esc(t.outcome||'mixed')}">${esc(t.outcome||'mixed')}</span></div>
              <div class="tc-date">${esc(t.date||'')}</div>
              ${t.expected?`<div class="tc-row"><b>Expected</b>${esc(t.expected)}</div>`:''}
              ${t.actual?`<div class="tc-row"><b>Actual</b>${esc(t.actual)}</div>`:''}
              ${t.learned?`<div class="tc-row"><b>Learned</b>${esc(t.learned)}</div>`:''}
            </div>`;
        }
        const c = item.data;
        return `
          <div class="lt-card">
            <div class="tc-top"><h4>${esc(c.course)}</h4><span class="pill course">${c.inProgress ? 'In progress' : 'Completed'}</span></div>
            <div class="tc-date">${esc(c.completedDate||'')}</div>
              ${c.learned && (c.learned.length ? `<div class="tc-row"><b>Learned</b>${esc(c.learned.join ? c.learned.join(' · ') : c.learned)}</div>` : '')}
            ${c.usedFor ? `<div class="tc-row"><b>Used for</b>${esc(c.usedFor)}</div>` : ''}
            ${c.proofUrl ? `<div class="tc-row"><a style="color:var(--uy-pink);font-size:.85rem;" href="${esc(c.proofUrl)}" target="_blank" rel="noopener">View certificate →</a></div>` : ''}
          </div>`;
      }).join('') + '</div>';
    }
    dayContent.innerHTML = body;
  }

  function renderRandom(){
    const list = window.RANDOM_STUFF || [];
    let body = secHeader('random');
    if(!list.length){ body += emptyBlock('Drop a random thought, screenshot, or photo here anytime.'); }
    else {
      body += '<div class="random-grid">' + list.map(r=>{
        if(r.type === 'photo'){
          return `<div class="random-note">${r.src?`<img src="${esc(r.src)}" alt="">`:''}${r.caption?esc(r.caption):''}</div>`;
        }
        return `<div class="random-note">${esc(r.text)}</div>`;
      }).join('') + '</div>';
    }
    dayContent.innerHTML = body;
  }

  const sectionRenderers = { 'learned-tried':renderLearnedTried, random:renderRandom };

  // section nav
  document.getElementById('uy-nav').addEventListener('click', (e)=>{
    const a = e.target.closest('a[data-view]');
    if(!a) return;
    e.preventDefault();
    const view = a.dataset.view;
    setActiveNav(view);
    if(view === 'daily'){
      document.getElementById('uy-ribbon').textContent = 'Daily Life';
      const entry = entries.find(x=>x.day===currentDay) || entries[entries.length-1];
      renderDay(entry);
      topDate.textContent = entry ? monthOf(entry.date) + (entry.weekday?', '+entry.weekday:'') : '— — —';
      return;
    }
    topDate.textContent = secMeta[view].title;
    document.getElementById('uy-ribbon').textContent = secMeta[view].title;
    (sectionRenderers[view] || function(){})();
  });

  // init
  renderDay(entries.find(e=>e.day===currentDay));
  renderStrip();
})();
</script>
</body>
</html>
